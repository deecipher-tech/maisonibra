<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin sign in | MAISON IBRA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/admin.css" />
</head>
<body class="login-page">
  <main class="login">
    <p class="login-brand">MAISON IBRA</p>
    <h1 id="loginTitle">Admin sign in</h1>
    <p class="hint" id="loginHint"></p>
    <form id="loginForm" novalidate>
      <div class="field"><label for="pw" id="pwLabel">Password</label><input id="pw" type="password" autocomplete="current-password" required /></div>
      <div class="field" id="confirmField" hidden><label for="pw2">Confirm password</label><input id="pw2" type="password" autocomplete="new-password" /></div>
      <p class="err" id="loginErr" role="alert"></p>
      <button class="btn gold" type="submit" id="loginBtn">Sign in</button>
    </form>
    <a class="side-store" href="index.html">← Back to store</a>
  </main>
  <script src="./assets/js/auth.js"></script>
  <script src="./assets/js/login.js"></script>
</body>
</html>
